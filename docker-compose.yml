services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: tcc-laravel-sqs
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            - mysql
        networks:
            - laravel
        env_file:
            - .env

    mysql:
        image: mysql:8.0
        container_name: mysql-db
        restart: unless-stopped
        ports:
            - "33061:3306"
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - laravel

    jaeger:
        image: jaegertracing/all-in-one:latest
        container_name: jaeger
        restart: unless-stopped
        ports:
            - "16686:16686" # Jaeger UI
            - "4318:4318" # OTLP/HTTP Receiver
        environment:
            - COLLECTOR_OTLP_ENABLED=true
        networks:
            - laravel

networks:
    laravel:
        driver: bridge

volumes:
    mysql-data:
        driver: local
